<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!--
        img - Image
        src - Source
        alt - Alternative
        width - largura
        height - altura
        title - titulo da imagem
    -->

    <figure>
        <img src="imagens/praia.jpeg""
            alt="Imagem de uma praia"
            width="300"
            title="Praia de boa vista">
            <figcaption>Praia da boa vista</figcaption>
    </figure>
        
    
</body>
</html>
