<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Formulários</title>
</head>
<body>

    <h2>Exercício de Formulários</h2>

    <form>
        <fieldset>
            <legend>Dados pessoais</legend>

            <label>
                Nome <br>
                <input type="text" name="nome">
            </label> <br>

            <label>
                Email <br>
                <input type="text" name="email">
            </label> <br>

            <input type="checkbox" name="ativarEmail" id="ativarEmail">
            <label for="ativarEmail">Quero receber e-mail</label> <br> <br>

            <label>
                Senha <br>
                <input type="password" name="senha">
            </label> <br>
           
        </fieldset>

        <fieldset>
            <legend>Informações adicionais</legend>
            <input type="radio" name="tipo" value="Pessoa Física" id="pessoaFisica">
            <label for="pessoaFisica">Pessoa física</label>
            <input type="radio" name="tipo" value="Pessoa Jurídica" id="pessoaJuridica">
            <label for="pessoaJuridica">Pessoa Jurídica</label>
        </fieldset>

        <input type="submit" value="Cadastrar">
    </form>
    
</body>
</html>
