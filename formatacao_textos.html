<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Formatação de textos</h2>
    Esse é um texto em <b>negrito</b> <br>
    Esse é um texto <strong>importante</strong> <br>
    Esse é um texto <i>itálico</i> <br>
    Esse é um texto <em>ênfase</em>
    Esse é um texto <marked>marcado</marked> <br>

    Esse é um texto <u>sublinhado</u> <br>
    Esse é um texto <del>apagado</del> <br>
    
    <h2>Diferentes tipos de caractéres</h2>
    Sobreescrito: 10<sup>2</sup> <br>
    Subscrito: H<sub>2</sub>0 <br>
    
</body>
</html>
