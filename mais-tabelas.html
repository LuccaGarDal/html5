<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
        caption -> Legenda / título da tabela
        thead -> Table Header (cabeçalho da tabela)
        tbody -> Table Body (corpo da tabela)
        tfoot -> Table Footer (rodapé da tabela)
    -->

    <table border="1">
        <caption>Listagem de produtos</caption>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
             </tr>
        </thead>

        <tbody>
            <tr>
                <td>Notebook</td>
                <td>1</td>
                <td>10000</td>
            </tr>
            <tr>
                <td>Tablet</td>
                <td>2</td>
                <td>20000</td>
            </tr>

        </tbody>

        <tfoot>
            <tr>
                <td>Total</td>
                <td colspan="2">4000R$</td>
            </tr>
        </tfoot>

    </table>
    
</body>
</html>
