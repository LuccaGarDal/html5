<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!--
        img - Image
        src - Source
        alt - Alternative
        width - largura
        height - altura
        title - titulo da imagem
        
        Caminho relativo:
        ../imagens/praia.jpe

        Caminho absoluto:
        /imagens/praia.jpeg


    -->
        <img src="/imagens/praia.jpeg""
            alt="Imagem de uma praia"
            width="200"
            height="500"
            title="Praia de boa vista"
        >
    
</body>
</html>
