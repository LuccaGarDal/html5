<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executando Vídeos</title>
</head>
<body>
    <h1>Executando Vídeos</h1>

    <!--
        source -> fonte
        controls -> controles
        muted -> mutado
        autoplay -> reprodução automática
        loop -> reinicia automaticamente
        poster -> thumbnail
    -->

    <video width="300" controls muted poster="imagens-exercicio/logo.png">
        <source src="videos/abelhas.mp4" type="video/mp4">
        Seu navegador não suporta a execução desse vídeo!
    </video>

    <iframe width="600" height="320" src="produtos.html"></iframe>
